description: 'Jiumaojiu (Jiu Mao Jiu International Holdings, HKEX: 09922) is a Chinese casual-dining
  restaurant group headquartered in Guangzhou and listed on the Hong Kong Stock Exchange since January
  2020. Founded roughly three decades ago, it operates 600+ restaurants across mainland China, Southeast
  Asia and North America under five brands: Jiumaojiu (Shanxi handmade-noodle cuisine), Tai Er (sour
  cabbage fish, 400+ locations), Song Hot Pot (Chongqing hot pot), Shan Wai Mian (Guizhou sour-soup hot
  pot) and Chao Na Bian (Chaoshan grilled beef). Backed by IDG Capital. As a consumer food-and-beverage
  operator it publishes no public developer API, documentation portal, or SDKs; this profile is retained
  in the API Evangelist network as a company identity lead.'
